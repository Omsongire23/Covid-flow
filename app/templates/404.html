{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container section text-center py-16">
  <div class="error-code text-6xl font-bold text-primary mb-4 font-mono">404</div>
  <h1 class="page-title mb-2">Page Not Found</h1>
  <p class="text-muted max-w-md mx-auto mb-8">
    The epidemiological report or resource page you requested could not be found or may have been relocated.
  </p>
  <div class="flex-center gap-4">
    <a href="{{ url_for('public.index') }}" class="btn btn-primary">Return to Dashboard</a>
    <a href="{{ url_for('public.helplines') }}" class="btn btn-outline">Emergency Directory</a>
  </div>
</div>
{% endblock %}
